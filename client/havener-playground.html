<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Foghaven — Havener Animation Playground</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16121c;
        --panel: #211c2b;
        --border: #3a3348;
        --ink: #e8e2f2;
        --ink-dim: #9c93b3;
        --accent: #ffc65c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      h1 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-dim);
        margin: 0 0 12px;
      }
      #stage {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        border-right: 1px solid var(--border);
      }
      #playground-canvas canvas {
        display: block;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      #stage p {
        max-width: 420px;
        color: var(--ink-dim);
        font-size: 13px;
        line-height: 1.5;
      }
      #controls {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px 20px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }
      button {
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.danger {
        border-color: #a8402c;
        color: #ff9f8a;
      }
      .sliders {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 12px;
        align-items: start;
      }
      fieldset {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 14px 14px;
      }
      legend {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent);
        padding: 0 6px;
      }
      .slider-row {
        display: grid;
        grid-template-columns: 120px 1fr 48px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        padding: 3px 0;
      }
      .slider-label {
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slider-value {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <h1>Havener Playground</h1>
      <div id="playground-canvas"></div>
      <p>
        Dev-only §4.4 animation tuner — not part of the shipped game (this page is not a
        build entry point). Click a state to play it exactly the way GameScene would.
        Every slider below edits <code>HAVENER_ANIM_CONFIG</code> live and restarts
        whatever loop is currently playing.
      </p>
    </div>
    <div id="controls"></div>
    <script type="module" src="/src/game/characters/havenerPlayground.ts"></script>
  </body>
</html>
